name: deal-pipeline-tracker

# Only the Caddy gateway publishes a host port. Everything else is reachable only on the compose
# networks (docs/standards/CONTAINER_STANDARDS.md, ADR 0002, ADR 0013).
#
#   edge      gateway, web, api, mailpit (so the dev gateway can serve the inbox)
#   internal  Supabase (db, auth, rest, realtime, supabase-gateway), mailpit, migrate, api.
#             `internal: true`: no host access and no route to the internet.
#
# Secrets: every value below has a clearly marked DEV-ONLY default so `docker compose up` works
# with zero setup. The stack is unreachable from outside the compose networks. `make env` writes
# random per-machine values to the untracked .env, which override these defaults; real
# deployments must supply their own (ADR 0014).

x-dev-secrets:
  pg-password: &pg-password '${POSTGRES_PASSWORD:-dev-only-postgres-password-change-me}'
  jwt-secret: &jwt-secret '${JWT_SECRET:-dev-only-jwt-secret-change-me-minimum-32-characters}'
  session-secret: &session-secret '${SESSION_SECRET:-dev-only-session-secret-change-me-minimum-32-characters}'
  secret-key-base: &secret-key-base '${SECRET_KEY_BASE:-dev-only-secret-key-base-change-me-minimum-64-characters-0123456789abcdef}'
  realtime-enc-key: &realtime-enc-key '${REALTIME_DB_ENC_KEY:-dev-only-rt-key!}'
  dashboard-password: &dashboard-password '${DASHBOARD_PASSWORD:-dev-only-dashboard-password}'

# Our own services: fully locked down.
x-hardening: &hardening
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  restart: unless-stopped

# Third-party images: no-new-privileges everywhere; read-only and cap_drop where they allow it.
x-vendor: &vendor
  security_opt: ['no-new-privileges:true']
  restart: unless-stopped

services:
  gateway:
    <<: *hardening
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: dpt-gateway:local
    ports:
      - '${GATEWAY_PORT:-8080}:8080'
    tmpfs: [/tmp]
    networks: [edge]
    volumes:
      # Development gateway: the production Caddyfile plus the Mailpit inbox route.
      - ./gateway/Caddyfile.dev:/etc/caddy/Caddyfile:ro
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s

  web:
    <<: *hardening
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: dpt-web:local
    environment:
      PORT: '3000'
      HOSTNAME: 0.0.0.0
      APP_ORIGIN: '${PUBLIC_BASE_URL:-http://localhost:${GATEWAY_PORT:-8080}}'
    # Next writes its runtime cache here; everything else stays read-only.
    tmpfs: [/tmp, /app/apps/web/.next/cache]
    networks: [edge]
    expose: ['3000']
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000/']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  api:
    <<: *hardening
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: dpt-api:local
    environment:
      PORT: '3001'
      DEPLOYMENT_ENV: development
      OBJECT_STORE_DRIVER: '${OBJECT_STORE_DRIVER:-fs}'
      STORAGE_DIRECTORY: /var/lib/dpt/files
      STORAGE_ENDPOINT: '${STORAGE_ENDPOINT:-http://rustfs:9000}'
      STORAGE_REGION: '${STORAGE_REGION:-auto}'
      STORAGE_BUCKET: '${STORAGE_BUCKET:-deal-pipeline-tracker}'
      STORAGE_KEY_PREFIX: '${STORAGE_KEY_PREFIX:-Dev/}'
      STORAGE_FORCE_PATH_STYLE: '${STORAGE_FORCE_PATH_STYLE:-true}'
      STORAGE_ACCESS_KEY_ID: '${STORAGE_ACCESS_KEY_ID:-}'
      STORAGE_SECRET_ACCESS_KEY: '${STORAGE_SECRET_ACCESS_KEY:-}'
      # The BFF is the only client of Supabase (reached over the internal network only).
      SUPABASE_URL: http://supabase-gateway:8000
      JWT_SECRET: *jwt-secret
      SESSION_SECRET: *session-secret
      APP_ORIGIN: '${PUBLIC_BASE_URL:-http://localhost:${GATEWAY_PORT:-8080}}'
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_SECURE: '${SMTP_SECURE:-false}'
      SMTP_REQUIRE_TLS: '${SMTP_REQUIRE_TLS:-false}'
      SMTP_USER: '${SMTP_USER:-}'
      SMTP_PASS: '${SMTP_PASS:-}'
      MAIL_FROM: no-reply@dpt.local
    tmpfs: [/tmp]
    volumes:
      - file-data:/var/lib/dpt/files
    networks: [edge, internal]
    expose: ['3001']
    depends_on:
      supabase-gateway: { condition: service_healthy }
      demo-seed: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3001/health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # One-shot: creates fixed fictional users through GoTrue, then calls the restricted seed RPC.
  demo-seed:
    <<: *hardening
    image: dpt-api:local
    command: ['node', 'dist/seed-main.js']
    restart: 'no'
    tmpfs: [/tmp]
    networks: [internal]
    environment:
      SUPABASE_URL: http://supabase-gateway:8000
      JWT_SECRET: *jwt-secret
      SEED_DEV_DATA: '${SEED_DEV_DATA:-true}'
      SEED_DEMO_PASSWORD: '${SEED_DEMO_PASSWORD:-Dev-only-demo-password-change-me}'
    depends_on:
      supabase-gateway: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  # ---- Supabase (ADR 0013): five services, versions pinned by digest ------------------------

  db:
    <<: *vendor
    image: supabase/postgres:17.11.0.011@sha256:7bd84e6a1d5322c7b864b9751873a0ac50f48df3f20a776e88114eadb2948fc0
    networks: [internal]
    volumes:
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
      # Vendored from upstream (supabase/UPSTREAM.md); only the three scripts we need.
      - ./supabase/db/init/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:ro
      - ./supabase/db/init/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./supabase/db/init/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      # pgTAP tests, run with `make test-db`.
      - ./supabase/tests:/tests:ro
      - ./packages/shared/fixtures:/fixtures:ro
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: '5432'
      POSTGRES_PORT: '5432'
      PGPASSWORD: *pg-password
      POSTGRES_PASSWORD: *pg-password
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: '3600'
    # log_min_messages=fatal keeps Realtime's polling queries out of the logs.
    command:
      [
        'postgres',
        '-c',
        'config_file=/etc/postgresql/postgresql.conf',
        '-c',
        'log_min_messages=fatal',
      ]
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies supabase/migrations (checksummed, never edited) and the optional dev seed.
  migrate:
    <<: *vendor
    image: supabase/postgres:17.11.0.011@sha256:7bd84e6a1d5322c7b864b9751873a0ac50f48df3f20a776e88114eadb2948fc0
    restart: 'no'
    networks: [internal]
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - ./supabase/migrate.sh:/migrate.sh:ro
      - ./supabase/migrations:/migrations:ro
      - ./supabase/seed.sql:/seed.sql:ro
    entrypoint: ['/bin/sh', '/migrate.sh']
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: *pg-password
      SEED_DEV_DATA: '${SEED_DEV_DATA:-true}'

  auth:
    <<: *vendor
    image: supabase/gotrue:v2.197.0@sha256:1736a63078f5922b198c4cbe50f80ab9a2d3b54fe8b7b6cfb2e9dc5dbbc12c6b
    networks: [internal]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9999/health']
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: '9999'
      API_EXTERNAL_URL: http://supabase-gateway:8000/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin@db:5432/postgres
      PGPASSWORD: *pg-password
      GOTRUE_SITE_URL: '${PUBLIC_BASE_URL:-http://localhost:8080}'
      GOTRUE_URI_ALLOW_LIST: ''
      # Users are created only through the BFF (admin API) after our own email verification.
      GOTRUE_DISABLE_SIGNUP: 'true'
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: '3600'
      GOTRUE_JWT_SECRET: *jwt-secret
      GOTRUE_JWT_ISSUER: http://supabase-gateway:8000/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: 'false'
      GOTRUE_EXTERNAL_PHONE_ENABLED: 'false'
      # Email must be confirmed before password login works (ADR 0002 item 13, verified).
      GOTRUE_MAILER_AUTOCONFIRM: 'false'
      GOTRUE_SMTP_ADMIN_EMAIL: no-reply@dpt.local
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: '1025'
      # Mailpit needs no login, and Go's SMTP client refuses to send credentials over a plaintext
      # connection ("unencrypted connection"), so send none.
      GOTRUE_SMTP_USER: ''
      GOTRUE_SMTP_PASS: ''
      GOTRUE_SMTP_SENDER_NAME: Deal Pipeline Tracker
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify

  rest:
    <<: *vendor
    image: postgrest/postgrest:v16.5@sha256:1347d7552b88f17832912c06afbf7c43209af6eeeb60834b04aae12c9bd9d5cc
    networks: [internal]
    depends_on:
      db: { condition: service_healthy }
    command: ['postgrest']
    healthcheck:
      test: ['CMD', 'postgrest', '--ready']
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      PGRST_DB_URI: postgres://authenticator@db:5432/postgres
      PGPASSWORD: *pg-password
      PGRST_DB_SCHEMAS: public
      PGRST_DB_MAX_ROWS: '1000'
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: '3001'
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: *jwt-secret
      PGRST_DB_USE_LEGACY_GUCS: 'false'
      PGRST_APP_SETTINGS_JWT_EXP: '3600'

  realtime:
    <<: *vendor
    image: supabase/realtime:v2.150.1@sha256:a5745cff61c726232003ed9ba72e7284230c31177cfa444aea11c529e28af5e2
    networks:
      internal:
        # Realtime selects its tenant from the first label of the host name, so this alias is
        # required (it is also the address the vendored gateway config proxies to).
        aliases: [realtime-dev.supabase-realtime]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'curl -sSf -o /dev/null http://localhost:4000/']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    environment:
      PORT: '4000'
      DB_HOST: db
      DB_PORT: '5432'
      DB_USER: supabase_admin
      DB_PASSWORD: *pg-password
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: *realtime-enc-key
      API_JWT_SECRET: *jwt-secret
      SECRET_KEY_BASE: *secret-key-base
      METRICS_JWT_SECRET: *jwt-secret
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: '10000'
      APP_NAME: realtime
      SEED_SELF_HOST: 'true'
      RUN_JANITOR: 'true'
      DISABLE_HEALTHCHECK_LOGGING: 'true'

  # Internal API gateway (Envoy). Vendored and trimmed config, keys derived at start (ADR 0014).
  supabase-gateway:
    <<: *vendor
    image: envoyproxy/envoy:v1.40.2@sha256:8de97e654644827d62afdbf7e1d3dc9fee01a8690d410dd1c63a30dc6b6cecbb
    networks: [internal]
    depends_on:
      auth: { condition: service_healthy }
      rest: { condition: service_healthy }
      realtime: { condition: service_healthy }
    entrypoint: ['/bin/sh', '/docker-entrypoint.sh']
    tmpfs: [/tmp]
    volumes:
      - ./supabase/gateway/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./supabase/gateway/cds.yaml:/etc/envoy/cds.yaml:ro
      - ./supabase/gateway/lds.template.yaml:/etc/envoy/lds.template.yaml:ro
      - ./supabase/gateway/docker-entrypoint.sh:/docker-entrypoint.sh:ro
      - ./supabase/gateway/healthcheck.sh:/healthcheck.sh:ro
    environment:
      JWT_SECRET: *jwt-secret
      DASHBOARD_USERNAME: supabase
      DASHBOARD_PASSWORD: *dashboard-password
    healthcheck:
      # Exercises the real routes with the derived keys, not just the listening port.
      test: ['CMD', 'timeout', '8', 'bash', '/healthcheck.sh']
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 5s

  # Development mail catcher (SMTP :1025, inbox :8025 served under /mail/ by the dev gateway).
  mailpit:
    <<: *hardening
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    user: '65532:65532'
    tmpfs: [/tmp] # Mailpit keeps its message store in a temp file; the root filesystem is read-only
    networks: [edge, internal]
    environment:
      MP_WEBROOT: /mail/
      MP_MAX_MESSAGES: '500'
    expose: ['1025', '8025']
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s

networks:
  edge: {}
  internal:
    internal: true

volumes:
  db-data: {}
  db-config: {}
  file-data: {}
